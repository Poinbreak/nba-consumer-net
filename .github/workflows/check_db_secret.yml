name: Check DB Secret
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Show URI structure (password never printed)
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          raw = os.environ.get("DATABASE_URL", "")
          print("secret length:", len(raw), "| starts with:", raw[:13])
          u = urlsplit(raw)
          print("scheme:", u.scheme)
          print("username:", u.username)
          print("password length:", len(u.password or ""), "| contains raw '@' or '#':", any(c in (u.password or "") for c in "@#"))
          print("host:", u.hostname, "| port:", u.port, "| db:", u.path)
          print("count of '@' in whole string:", raw.count("@"))
          PY
