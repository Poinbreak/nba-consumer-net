name: Awards and Title Odds
on:
  schedule:
    - cron: '0 9 * * *'      # daily, after the overnight score sync
  workflow_dispatch:

concurrency:
  group: nba-db-writes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - run: pip install -r backend/requirements-ci.txt
      - name: Retrain award models (Basketball-Reference history via Kaggle)
        run: python backend/ml/train_awards.py
      - name: Score current award races
        run: python backend/ml/predict_awards.py
      - name: Simulate season (win totals, playoff and title odds)
        run: python backend/ml/simulate_season.py --sims 5000
