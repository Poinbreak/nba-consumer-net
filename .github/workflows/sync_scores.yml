name: Sync Live Scores
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: nba-db-writes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - run: pip install -r backend/requirements-ci.txt
      - name: Sync scoreboard + box scores
        run: python backend/scripts/sync_scores.py --back 1 --ahead 2
