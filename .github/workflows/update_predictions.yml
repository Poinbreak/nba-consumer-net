name: Update Predictions
on:
  schedule:
    - cron: '30 */3 * * *'
  workflow_dispatch:

concurrency:
  group: nba-db-writes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - run: pip install -r backend/requirements-ci.txt
      - name: Retrain game model on latest results
        run: python backend/ml/train_game_model.py
      - name: Predict upcoming games
        run: python backend/ml/predict_upcoming.py --days 14
